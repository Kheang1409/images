<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="text" x1="24" y1="24" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D3748"/>
      <stop offset="1" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#4ECDC4"/>
    </linearGradient>
  </defs>

  <!-- Transforming KAI to Face -->
  <g>
    <!-- K morphing to left eye -->
    <path d="M32 50 L32 80 M32 65 L48 50 M32 65 L48 80" fill="none" stroke="url(#text)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M32 50 L32 80 M32 65 L48 50 M32 65 L48 80;M36 52 L36 78 M36 65 L46 52 M36 65 L46 78;M40 55 C40 50 45 50 45 55 C45 60 40 60 40 55;M40 55 C40 50 45 50 45 55 C45 60 40 60 40 55" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1; 0.25 0.1 0.25 1"/>
    </path>
    <!-- A morphing to right eye -->
    <path d="M56 50 L64 80 L72 50 M59 65 L69 65" fill="none" stroke="url(#text)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M56 50 L64 80 L72 50 M59 65 L69 65;M58 52 L64 78 L70 52 M60 65 L68 65;M70 55 C70 50 75 50 75 55 C75 60 70 60 70 55;M70 55 C70 50 75 50 75 55 C75 60 70 60 70 55" dur="6s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1; 0.25 0.1 0.25 1"/>
    </path>
    <!-- I morphing to mouth -->
    <path d="M88 50 L88 80" fill="none" stroke="url(#text)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M88 50 L88 80;M86 52 L86 78;M84 55 L84 75;M64 75 C64 70 74 70 74 75 C74 80 64 80 64 75;M64 75 C64 70 74 70 74 75 C74 80 64 80 64 75" dur="6s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.25 0.1 0.25 1; 0.25 0.1 0.25 1; 0.25 0.1 0.25 1; 0.25 0.1 0.25 1"/>
    </path>
  </g>

  <!-- Gear icon in top right, spinning and zooming -->
  <g transform="translate(96, 24)">
    <path d="M12 2.25C10.205 2.25 8.75 3.705 8.75 5.5C8.75 7.295 10.205 8.75 12 8.75C13.795 8.75 15.25 7.295 15.25 5.5C15.25 3.705 13.795 2.25 12 2.25ZM12 0C15.314 0 18 2.686 18 6C18 9.314 15.314 12 12 12C8.686 12 6 9.314 6 6C6 2.686 8.686 0 12 0ZM9.75 3.75L8.25 2.25L6 4.5L7.5 6L9.75 3.75ZM14.25 3.75L15.75 2.25L18 4.5L16.5 6L14.25 3.75ZM12 7.5C11.172 7.5 10.5 6.828 10.5 6C10.5 5.172 11.172 4.5 12 4.5C12.828 4.5 13.5 5.172 13.5 6C13.5 6.828 12.828 7.5 12 7.5Z" fill="url(#gear)">
      <animateTransform attributeName="transform" type="rotate" values="0 12 6;360 12 6" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
